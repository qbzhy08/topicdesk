<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>主题编辑台</title>
<link rel="stylesheet" href="/static/style.css?v=1013f">
</head>
<body>
<header class="masthead">
  <a href="#/" class="brand">主题编辑台<span>TopicDesk</span></a>
  <nav id="nav">
    <a href="#/" data-nav="tasks">任务</a>
    <a href="#/library" data-nav="library">资料库</a>
    <a href="#/memory" data-nav="memory">记忆</a>
    <a href="#/skills" data-nav="skills">写法 Skill</a>
    <a href="#/sources" data-nav="sources">信息源</a>
    <a href="#/settings" data-nav="settings">设置</a>
  </nav>
</header>

<main id="app">
  <aside class="rail" id="rail">
    <a href="#/new" class="new-topic-btn" id="new-topic-btn"><span class="spark">✳</span> 新主题</a>
    <details class="import-box">
      <summary>导入链接</summary>
    <form id="import-form">
      <label>链接<input name="url" required placeholder="https://..."></label>
      <label>归入主题<input name="topic" placeholder="可空"></label>
      <button type="submit" class="ghost">导入</button>
    </form>
    </details>
    <h3 class="rail-title">最近任务</h3>
    <ul id="task-list" class="task-list"></ul>
  </aside>

  <div class="detail-col">
    <nav class="histbar" id="histbar" aria-label="页面历史">
      <span class="histnav">
        <button type="button" id="nav-back" title="返回（Alt+←）" aria-label="返回">&#8592;</button>
        <button type="button" id="nav-fwd" title="前进（Alt+→）" aria-label="前进">&#8594;</button>
      </span>
      <span class="hist-crumb"><button type="button" class="hist-prev" id="hist-prev" hidden></button><b id="hist-cur"></b></span>
    </nav>
    <section id="detail" class="detail">
      <div class="empty">从左侧提交一个主题，或打开已有任务。<br>任务进度保存在本地数据库，刷新页面不会丢失。</div>
    </section>
  </div>
</main>

<template id="tpl-detail">
  <div data-f="flow"></div>
  <div class="detail-head">
    <div>
      <p class="kicker" data-f="graph"></p>
      <h1 data-f="topic"></h1>
      <p class="meta"><span class="badge" data-f="status"></span> <span data-f="node"></span></p>
    </div>
    <div class="actions">
      <a class="btn ghost" data-f="docs-link">查看本次资料</a>
      <button data-act="resume" class="ghost">继续执行</button>
      <button data-act="cancel" class="ghost danger">取消</button>
    </div>
  </div>
  <div class="live" data-f="live" hidden><span class="orb"></span><span data-f="live-text"></span><span class="live-time" data-f="live-time"></span></div>
  <div class="budget" data-f="budget"></div>
  <p class="error" data-f="error"></p>
  <div data-f="hitl"></div>
  <div data-f="write"></div>
  <div data-f="ranking"></div>
  <div data-f="report"></div>
  <details class="card rewind">
    <summary>从某一步重新执行</summary>
    <p class="small">选一步，<b>从这一步往后重新执行</b>，任务已有的中间结果都保留。输入没变的检索、抓取和大模型调用直接用上次的结果，
      只有受你改动影响的部分才会真正重做。所以它适合在你<b>改了某样东西之后</b>用，或者任务中途失败时从失败处接着跑。</p>
    <ul class="small rewind-eg" data-f="rewind-eg"></ul>
    <div class="row">
      <select data-f="rewind-node"></select>
      <button data-act="rewind" class="ghost">从这一步重新执行</button>
    </div>
    <details class="small"><summary>高级：同时清掉某些中间结果</summary>
      <input data-f="rewind-inv" placeholder="要清掉的中间结果键名，逗号分隔，例如 verdicts（可空）">
      <p class="muted">清掉后这些结果会重新计算，而不是沿用上一次的。键名见页面底部“任务内记忆”。</p></details>
  </details>
  <h2 class="section">任务轨迹</h2>
  <p class="durs small" data-f="durs"></p>
  <ol class="timeline" data-f="timeline"></ol>
  <details class="card">
    <summary>任务内记忆（当前状态）</summary>
    <pre data-f="state"></pre>
  </details>
</template>

<div id="composer-holder" hidden>
  <form id="new-task" class="composer-form">
    <div class="composer">
      <textarea name="topic" rows="2" required placeholder="想追踪什么主题？例如：开源大模型的长上下文评测"></textarea>
      <div class="composer-bar">
        <div class="chips" id="domain-pick" title="不选 = 自动判断领域，并据此挑选信息源">
          <span id="domain-chips" class="chips-inline"></span>
          <button type="button" class="chip-add" id="tag-add-btn" title="新建领域标签">＋ 标签</button>
          <select name="days" class="chip-sel" title="时间范围"><option value="7">近 7 天</option><option value="30">近 30 天</option><option value="90" selected>近 90 天</option><option value="180">近半年</option><option value="365">近一年</option></select>
        </div>
        <button type="submit" class="send" title="开始检索（Enter）" aria-label="开始检索">↑</button>
      </div>
    </div>
    <div class="tag-pop" id="tag-pop" hidden></div>
    <p class="composer-hint">Enter 开始 · Shift+Enter 换行 · 不选领域时自动判断</p>
    <details class="composer-more">
      <summary>关键词与高级设置</summary>
      <label>中文关键词（逗号分隔，可修改）<input name="keywords" placeholder="填写主题后自动生成"></label>
      <label>英文检索式（逗号分隔，可修改）<input name="en_keywords" placeholder="填写主题后自动翻译"></label>
      <div class="kw-bar">
        <label class="opt"><input type="checkbox" name="auto_translate" checked> 自动翻译中英文关键词</label>
        <button type="button" class="ghost sm" id="kw-btn">⇄ 重新翻译</button>
      </div>
      <p class="small kw-note" id="kw-note"></p>
      <fieldset class="more-group"><legend>本次要求（默认只对本次生效）</legend>
        <label>关注重点<input name="tt_focus" placeholder="例如：复现结果, 大海捞针"></label>
        <label>不想看的内容<input name="tt_exclude" placeholder="例如：融资, 手机"></label>
        <label class="opt"><input type="checkbox" name="tt_save"> 同时保存为长期偏好（以后的任务也生效）</label>
      </fieldset>
      <fieldset class="more-group"><legend>来源、预算与流程</legend>
        <div class="src-checks" id="src-checks"></div>
        <div class="grid2">
          <label>相关度门槛<select name="min_relevance"><option value="0.3">宽松 0.3</option><option value="0.4" selected>标准 0.4</option><option value="0.55">严格 0.55</option></select></label>
          <label>资料上限<input name="max_docs" type="number" value="40"></label>
          <label>抓全文上限<input name="max_fetch" type="number" value="15"></label>
          <label>最多步数<input name="max_steps" type="number" value="150"></label>
          <label>工具调用<input name="max_tool_calls" type="number" value="250"></label>
          <label>时长 (秒)<input name="max_seconds" type="number" value="900"></label>
          <label>成本 ($)<input name="max_cost" type="number" step="0.1" value="1"></label>
        </div>
        <label class="opt"><input type="checkbox" name="hitl_on_block"> 页面受限时暂停，等我处理</label>
        <label class="opt"><input type="checkbox" name="confirm_aspects"> 检索前让我确认子问题</label>
        <label>流程<select name="graph"></select></label>
        <label>额外参数 (JSON)<textarea name="params" rows="2">{}</textarea></label>
      </fieldset>
    </details>
  </form>
</div>
<script src="/static/app.js?v=1013f"></script>
</body>
</html>
